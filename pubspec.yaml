name: vikunja_app
description: Vikunja as Flutter cross platform app

version: 0.1.8-beta

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  background_downloader: ^9.2.3
  cached_network_image: ^3.4.1
  collection: ^1.18.0
  cronet_http: ^1.6.0
  cupertino_http: ^2.0.2
  dynamic_color: ^1.7.0
  flutter_colorpicker: ^1.1.0
  flutter_lints: ^6.0.0
  flutter_local_notifications: ^21.0.0
  flutter_riverpod: ^3.1.0
  flutter_secure_storage: ^10.0.0
  flutter_spinkit: ^5.2.2
  flutter_svg: ^2.2.4
  flutter_timezone: ^5.0.0
  flutter_widget_from_html: ^0.17.1
  home_widget: ^0.9.1
  appflowy_editor: ^6.2.0
  http: ^1.6.0
  intl: ^0.20.2
  logging: ^1.3.0
  package_info_plus: ^9.0.0
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  riverpod_annotation: ^4.0.0
  timezone: ^0.11.0
  app_links: ^7.0.0
  crypto: ^3.0.6
  url_launcher: ^6.2.5
  workmanager: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
    version: any
  integration_test:
    sdk: flutter
  build_runner: ^2.15.0
  custom_lint: ^0.8.1
  flutter_launcher_icons: ^0.14.3
  riverpod_generator: ^4.0.0
  riverpod_lint: ^3.1.0

flutter_icons:
  image_path: "assets/vikunja_logo.png"
  image_path_ios: "assets/vikunja_ios.png"
  android: true
  ios: true
  adaptive_icon_background: "#FF455486"
  adaptive_icon_foreground: "assets/vikunja_logo_adaptive.png"

flutter:
  default-flavor: unsigned
  uses-material-design: true
  generate: true
  assets:
    - assets/graphics/hypnotize.png
    - assets/vikunja_logo.png
    - assets/vikunja_logo_full.png
    - assets/vikunja_logo_full_white.png
  fonts:
    - family: Quicksand
      fonts:
        - asset: assets/fonts/quicksand-v7-latin-regular.ttf
